
name: Build SUPER ADMIN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir extracted
          ZIP=$(find . -maxdepth 1 -iname 'SUPER_ADMIN_Android_Phone_Build*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Android ZIP file not found"
            exit 1
          fi
          unzip -q "$ZIP" -d extracted
          SETTINGS=$(find extracted -name settings.gradle -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found in ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SUPER-ADMIN-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
